<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Drive : give cars second chance, sell cars for good profit.</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <a href="index.html"><button>Back</button></a>
    <form action="html3.html" method="get">
    <style>
    .container {
      width: 300px;
      margin: 0 auto;
      padding: 20px;
border: 1px solid rgba(255, 255, 255, 0);
text-align: center;
    }
</style>
    <div class="container">
    <h1 id="logo">- Registration -</h1>
    <form>
        <!-- Full Name -->
        <table>
            <tr><td>Full Name</td></tr>
            <tr>
                <td>
                    <input type="text" name="full_name" id="full_name" minlength="5" maxlength="16" placeholder="Enter your full name" required>
                </td>
            </tr>
        </table>
        <br>

     
        <table>
            <tr><td>Email</td></tr>
            <tr>
                <td>
                    <input type="email" name="email" id="email" placeholder="Enter your email" required>
                </td>
            </tr>
        </table>
        <br>

      
        <table>
            <tr><td>Password</td></tr>
            <tr>
                <td>
                    <input type="password" name="password" id="password" minlength="6" maxlength="16" placeholder="Enter your password" required>
                </td>
            </tr>
        </table>
        <br>

        
        <table>
            <tr><td>Age</td></tr>
            <tr>
                <td>
                    <input type="number" name="age" id="age" min="18" max="100" placeholder="Age" required>
                </td>
            </tr>
        </table>
        <br>

        <!-- Gender -->
        <table>
            <tr><td>Gender</td></tr>
            <tr>
                <td>
                    <input type="radio" name="gender" id="male" value="male" required>
                    <label for="male">Male</label>
                    
                    <input type="radio" name="gender" id="female" value="female" required>
                    <label for="female">Female</label>
                    
                    <input type="radio" name="gender" id="other" value="other" required>
                    <label for="other">Other</label>
                </td>
            </tr>
        </table>
        <br>

 
        <div class="form-group">
            <br>
            <label for="country">Choose a city</label><br><br>
            <select name="country" id="country" required>
                <option value="" disabled selected>Please select a city</option>
                <option value="Tbilisi">Tbilisi</option>
                <option value="Kutaisi">Kutaisi</option>
                <option value="Gori">Gori</option>
                <option value="Batumi">Batumi</option>
                <option value="Axalcixe">Axalcixe</option>
                <option value="Sachkere">Sachkere</option>
                <option value="Ambrolauri">Ambrolauri</option>
                <option value="Telavi">Telavi</option>
            </select>
        </div>
     <br>
     <br>
        <button type="submit">Register</button>
        <br>
        <br>
     <a href="#">help</a>
</form>
</div>
</body>
</head>
